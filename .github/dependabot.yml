version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # These move together and a split bump breaks the restore.
      xunit:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      onnxruntime:
        patterns:
          - "Microsoft.ML.OnnxRuntime*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
